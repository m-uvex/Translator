<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Übersetzer</title>
<meta name="color-scheme" content="light dark"><link rel="stylesheet" href="style.css"></head><body>
<div class="titlebar"><span class="tbname" data-t="appTitle"></span><span class="sp"></span><div class="tbctl"><button class="ib tbb" id="winMin" data-i="winMin" data-tt="winMin"></button><button class="ib tbb" id="winMax" data-i="winMax" data-tt="winMax"></button><button class="ib tbb" id="winClose" data-i="x" data-tt="winClose"></button></div></div>
<div class="app">
  <nav class="rail">
    <div class="rg"><button class="ib rb active" id="nvTr" data-i="languages" data-tt="navTr"></button><button class="ib rb" id="nvEd" data-i="doc" data-tt="navEd"></button><button class="ib rb" id="nvLib" data-i="library" data-tt="navLib"></button><button class="ib rb" id="nvTxt" data-i="reading" data-tt="navTxt"></button><button class="ib rb" id="nvVoc" data-i="vocab" data-tt="navVoc"></button><button class="ib rb" id="nvSrs" data-i="practice" data-tt="navSrs"></button></div>
    <div class="rg"><button class="ib" id="openSettings" data-i="sliders" data-tt="settings"></button></div>
  </nav>
  <div id="vT" class="view">
    <main>
      <header>
        <div class="langs"><button class="pill" id="srcBtn"></button><button class="ib" id="swap" data-i="swap" data-tt="swap"></button><button class="pill" id="tgtBtn"></button></div>
        <div class="model"><button class="pill" id="modelBtn"></button><button class="ib" id="refresh" data-i="refresh" data-tt="reloadModels"></button></div>
      </header>
      <section class="panes">
        <div class="card" id="drop">
          <div id="pickLayer" class="hidden"></div>
          <textarea id="input" data-ph="inputPh"></textarea>
          <div id="thumbs"></div>
          <footer><button class="ib" id="attach" data-i="clip" data-tt="attach"></button><button class="ib" id="pickBtn" data-i="pick" data-tt="pickT"></button><input type="file" id="file" hidden multiple accept="image/*,.txt,.md,.csv,.srt,.json,.html,.pdf,.docx"><span class="muted" id="count"></span><span class="sp"></span><button class="primary" id="go" data-t="translate"></button></footer>
        </div>
        <div class="card"><div id="output" class="out"></div><footer><span class="muted" id="status"></span><span class="sp"></span><button class="ib hidden" id="stopTr" data-i="stop" data-tt="stopTr"></button><button class="ib" id="copy" data-i="copy" data-tt="copy"></button></footer></div>
      </section>
    </main>
    <aside class="side">
      <div id="llmOnly"><div id="styles"></div>
        <details class="ctx"><summary data-t="context"></summary><textarea id="ctx" data-ph="ctxPh"></textarea></details>
        <details class="ctx"><summary data-t="glossary"></summary><div id="glossList"></div><button class="ghost" id="glAdd" data-t="addEntry"></button></details>
      </div>
      <p id="nllbNote" class="muted hidden"></p>
    </aside>
  </div>
  <div id="vE" class="view hidden">
    <div class="tb" id="edTb"></div>
    <div id="pageWrap"><div id="page" contenteditable="true" spellcheck="false"></div></div>
    <div class="sbar" id="edBar"></div>
    <div class="ctxbar hidden" id="ctxBar"></div>
    <input type="file" id="edFile" hidden accept=".txt,.md,.html,.docx,.pdf">
  </div>
  <div id="vL" class="view hidden">
    <header class="libhead"><h2 data-t="libTitle"></h2><span class="sp"></span><span class="muted" id="libCount"></span></header>
    <div id="libGrid" class="libgrid"></div>
    <div id="libEmpty" class="libempty hidden"><p data-t="libEmpty"></p><p class="muted" data-t="libEmptyHint"></p></div>
  </div>
  <div id="vTxt" class="view hidden">
    <header class="libhead"><h2 data-t="readTitle"></h2><span class="sp"></span><span class="pairbar" id="libPair"></span><span class="muted" id="txOther"></span><button class="ib" data-study-model></button></header>
    <div id="txtGrid" class="libgrid"></div>
    <div id="txtEmpty" class="libempty hidden"><p data-t="txEmpty"></p><p class="muted" data-t="txEmptyHint"></p></div>
    <div class="rfootbar"><span class="sp"></span><button class="ib" id="txStory" data-i="story" data-tt="storyT"></button><button class="ib" id="txAdd" data-i="plus" data-tt="txAdd"></button><button class="ib" id="txExp" data-i="download" data-tt="txtExp"></button><button class="ib" id="txImp" data-i="upload" data-tt="txtImp"></button></div>
  </div>
  <div id="vR" class="view hidden">
    <div class="rhead"><button class="ib" id="rBack" data-i="back" data-tt="navTxt"></button><h2 id="rTitle"></h2><span class="sp"></span><button class="ib" data-study-model></button><span class="muted" id="rMeta"></span></div>
    <div id="readerWrap"><article id="reader"></article></div>
  </div>
  <div id="vV" class="view hidden">
    <header class="libhead"><h2 data-t="vocTitle"></h2><span class="sp"></span><span class="pairbar" id="vocPair"></span><span class="muted" id="vocCount"></span><button class="ib" id="vocFindBtn" data-i="search" data-tt="vocSearchT"></button><button class="ib" id="vocFilterBtn" data-i="funnel" data-tt="vocFilterT"></button><button class="ib" id="vocSelBtn" data-i="checklist" data-tt="vocSelectT"></button><button class="ib" data-study-model></button></header>
    <div class="vbar"><div class="vadd"><input id="vocTerm" data-ph="vocTermPh"><button class="ib go" id="vocAddBtn" data-i="plus" data-tt="vocAdd"></button></div><div class="vacts"><button class="ib" id="vocFillBtn" data-i="filltr" data-tt="vocFillT"></button><button class="ib" id="vocCsvExp" data-i="download" data-tt="csvExp"></button><button class="ib" id="vocCsvImp" data-i="upload" data-tt="csvImp"></button></div></div>
    <div class="vbar hidden" id="vocFindRow"><div class="vadd"><input id="vocFind" data-ph="vocFindPh" autocomplete="off" spellcheck="false"><button class="ib" id="vocFindClear" data-i="x" data-tt="vocFindClear"></button></div></div>
    <div class="vbar hidden" id="vocSelBar"><span class="muted" id="vocSelCount"></span><span class="sp"></span><button class="ib" id="vocSelAllBtn" data-i="checkAll" data-tt="vocSelAll"></button><button class="ib" id="vocSelRepeatBtn" data-i="practice" data-tt="repStartT"></button><button class="ib" id="vocSelDelBtn" data-i="x" data-tt="vocSelDel"></button><button class="ib" id="vocSelEndBtn" data-i="back" data-tt="vocSelEnd"></button></div>
    <div id="vocMsg" class="vmsg hidden"></div>
    <div id="vocList" class="vlist"></div>
    <div id="vocNoHit" class="vmsg hidden" data-t="vocNoHit"></div>
    <div id="vocEmpty" class="libempty hidden"><p data-t="vocEmpty"></p><p class="muted" data-t="vocEmptyHint"></p></div>
  </div>
  <div id="vP" class="view hidden">
    <header class="libhead"><h2 data-t="srsTitle"></h2><span class="sp"></span><span class="pairbar" id="srsPair"></span><span class="muted" id="srsCount"></span><button class="ib" id="srsType" data-i="type" data-tt="srsTypeT"></button></header>
    <div id="srsBox" class="srsbox"></div>
  </div>
</div>
<div id="pop" class="pop hidden"></div><div id="alt" class="pop alt hidden"></div><div id="cm" class="pop hidden"></div><div id="trPop" class="pop trpop hidden"></div>
<dialog id="txDlg">
  <div class="dh"><h2 data-t="txAdd"></h2><button class="ib" id="txClose" data-i="x" data-tt="cancel"></button></div>
  <div class="txrow">
    <label class="txf"><span data-t="txTitleL"></span><input id="txTitle" data-ph="txTitlePh" maxlength="200"></label>
    <label class="txf"><span data-t="txCatL"></span><select id="txCat"></select></label>
  </div>
  <label class="txf"><span data-t="txBodyL"></span><textarea id="txBody" data-ph="txBodyPh"></textarea></label>
  <div class="txacts"><button class="ghost" id="txFile"><span data-i="upload"></span><span data-t="txFileL"></span></button><button class="ghost" id="txPaste"><span data-i="copy"></span><span data-t="txPasteL"></span></button><span class="sp"></span><button class="ghost" id="txCancel" data-t="cancel"></button><button class="primary" id="txOk" data-t="txOkL"></button></div>
</dialog>
<dialog id="stDlg">
  <div class="dh"><h2 data-t="storyH"></h2><button class="ib" id="stClose" data-i="x" data-tt="cancel"></button></div>
  <div class="stbody">
    <div class="stmain">
      <div id="stCloze" class="stframe"></div>
      <p class="muted sthint" data-t="stHint"></p>
      <div class="stfoot"><div class="stlen"><span data-t="stLenL"></span><div class="stsegs" id="stLen"><button type="button" class="stseg" data-len="short" data-t="stLenShort"></button><button type="button" class="stseg" data-len="mid" data-t="stLenMid"></button><button type="button" class="stseg" data-len="long" data-t="stLenLong"></button></div></div><span class="sp"></span><span class="muted" id="stCount"></span></div>
    </div>
    <aside class="stpool">
      <div class="stpoolhead"><b id="stPickHead"></b></div>
      <div id="stPicks" class="stpicks"></div>
      <div id="stMsg" class="vmsg stpoolmsg hidden"></div>
    </aside>
  </div>
  <div class="stacts"><span class="sp"></span><button class="ghost" id="stClear" data-t="stClear"></button><button class="ghost" id="stCancel" data-t="cancel"></button><button class="primary" id="stGo" data-t="stGo"></button></div>
</dialog>
<dialog id="vocDlg">
  <div class="dh"><h2 data-t="vocEdit"></h2><button class="ib" id="vocClose" data-i="x" data-tt="cancel"></button></div>
  <label class="vxf"><span data-t="vocTermL"></span><input id="vocTerm2" maxlength="120"></label>
  <label class="vxf"><span data-t="vocTransL"></span><input id="vocTr2" maxlength="240"></label>
  <label class="vxf"><span data-t="vocCtxL"></span><textarea id="vocCtx2"></textarea></label>
  <div id="vocDlgMsg" class="vmsg hidden"></div>
  <div class="vxacts"><span class="sp"></span><button class="ghost" id="vocCancel" data-t="cancel"></button><button class="primary" id="vocSaveBtn" data-t="save"></button></div>
</dialog>
<dialog id="ask"><p id="askText"></p><input id="askIn" class="hidden"><div class="dh"><button class="ghost" id="askNo"></button><button class="primary" id="askYes"></button></div></dialog>
<dialog id="styleDlg"></dialog>
<dialog id="sumDlg"></dialog>
<dialog id="dictDlg"></dialog>
<dialog id="settings"><div class="dh"><h2 data-t="settings"></h2><button class="ib" id="closeSet" data-i="x"></button></div><div id="setBody"></div>
<div class="dh"><button class="ghost" id="resetAll" data-t="resetAll"></button></div></dialog>
<script src="renderer.js"></script><script src="editor.js"></script><script src="study.js"></script></body></html>
